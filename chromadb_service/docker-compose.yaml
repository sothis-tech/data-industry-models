services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: industrial-chromadb
    ports:
      - "8200:8000"
    volumes:
      - ./chroma_data:/data          # ← /data en lugar de /chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - mcp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  mcp-net:
    driver: bridge
    name: mcp-net