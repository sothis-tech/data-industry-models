<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b7a"/>
    </marker>
    <style>
      .layer   { fill:#f7f9fb; stroke:#d6dee6; stroke-width:1.5; rx:10; }
      .layertitle { fill:#8595a5; font-size:12px; font-weight:700; letter-spacing:1.5px; }
      .svc     { rx:8; stroke-width:1.5; }
      .svctext { font-size:13px; font-weight:600; }
      .svcport { font-size:10.5px; font-weight:400; }
      .flow    { stroke:#5b6b7a; stroke-width:1.6; fill:none; }
      .flowlbl { fill:#5b6b7a; font-size:11px; font-style:italic; }
      .gw      { fill:#e8f0fe; stroke:#4285c5; }
      .gwtext  { fill:#1c4f8a; }
      .sec     { fill:#fdecec; stroke:#d9776f; }
      .sectext { fill:#a63d34; }
      .core    { fill:#e9f6ee; stroke:#4fa373; }
      .coretext{ fill:#2c6b46; }
      .ai      { fill:#f3ecfb; stroke:#9166c4; }
      .aitext  { fill:#5b3a8a; }
      .ot      { fill:#fef4e6; stroke:#d9a24f; }
      .ottext  { fill:#8a5c1c; }
      .db      { fill:#eef1f4; stroke:#9aa8b6; }
      .dbtext  { fill:#54636f; }
      .cli     { fill:#e5f6f6; stroke:#3ba7a7; }
      .clitext { fill:#1f6b6b; }
    </style>
  </defs>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2b3947">Industrial Data Space — Solution Architecture</text>
  <text x="500" y="55" text-anchor="middle" font-size="12.5" fill="#8595a5">Multitenant NGSI-LD platform · every request authenticated (Keycloak) and routed through the Kong gateway</text>

  <!-- ===== CLIENT LAYER ===== -->
  <rect class="layer" x="330" y="78" width="340" height="62"/>
  <rect class="svc cli" x="352" y="92" width="296" height="34"/>
  <text class="svctext clitext" x="500" y="108" text-anchor="middle">Modelador · Client applications</text>
  <text class="svcport clitext" x="500" y="121" text-anchor="middle">React UI · :8844 — selects tenant, sends token</text>

  <!-- client -> gateway -->
  <path class="flow" d="M500,140 L500,168" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="512" y="158">HTTPS · Bearer token + NGSILD-Tenant</text>

  <!-- ===== GATEWAY / SECURITY LAYER ===== -->
  <rect class="layer" x="140" y="172" width="820" height="96"/>
  <text class="layertitle" x="160" y="192">GATEWAY &amp; SECURITY</text>

  <rect class="svc gw" x="300" y="200" width="220" height="54"/>
  <text class="svctext gwtext" x="410" y="222" text-anchor="middle">Kong API Gateway</text>
  <text class="svcport gwtext" x="410" y="239" text-anchor="middle">:8010 proxy · :8011 admin</text>
  <text class="svcport gwtext" x="410" y="250" text-anchor="middle">JWT validation + tenant-role plugin</text>

  <rect class="svc sec" x="590" y="200" width="180" height="54"/>
  <text class="svctext sectext" x="680" y="220" text-anchor="middle">Keycloak (IdP)</text>
  <text class="svcport sectext" x="680" y="236" text-anchor="middle">:8085 · realm fiware</text>
  <text class="svcport sectext" x="680" y="248" text-anchor="middle">OpenID Connect · roles tenant_*</text>

  <!-- kong <-> keycloak -->
  <path class="flow" d="M520,227 L588,227" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="554" y="221" font-size="9.5" text-anchor="middle">validate</text>

  <!-- gateway -> services (more vertical room: bus at y=320) -->
  <path class="flow" d="M410,254 L410,320 L200,320 L200,366" marker-end="url(#arrow)"/>
  <path class="flow" d="M410,254 L410,336 L470,336 L470,366" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="415" y="300" font-size="10">routes: /quantum · /rag · /mcp</text>
  <text class="flowlbl" x="415" y="313" font-size="10">· /voice · /realms</text>

  <!-- ===== AI SERVICES (left) ===== -->
  <rect class="layer" x="140" y="370" width="250" height="150"/>
  <text class="layertitle" x="160" y="390">AI SERVICES</text>

  <rect class="svc ai" x="160" y="398" width="210" height="30"/>
  <text class="svctext aitext" x="265" y="418" text-anchor="middle">MCP Server · :8082</text>

  <rect class="svc ai" x="160" y="434" width="210" height="42"/>
  <text class="svctext aitext" x="265" y="452" text-anchor="middle">Voice Agent · :8014</text>
  <text class="svcport aitext" x="265" y="466" text-anchor="middle">wake word · Whisper ASR · TTS</text>

  <rect class="svc ai" x="160" y="482" width="210" height="30"/>
  <text class="svctext aitext" x="265" y="502" text-anchor="middle">RAG Manager · :8300</text>

  <!-- ===== CORE DATA SPACE (center) ===== -->
  <rect class="layer" x="404" y="370" width="250" height="150"/>
  <text class="layertitle" x="424" y="390">CORE DATA SPACE</text>

  <rect class="svc core" x="424" y="398" width="210" height="34"/>
  <text class="svctext coretext" x="529" y="415" text-anchor="middle">Orion-LD Context Broker</text>
  <text class="svcport coretext" x="529" y="427" text-anchor="middle">NGSI-LD core · :1027</text>

  <rect class="svc core" x="424" y="438" width="210" height="34"/>
  <text class="svctext coretext" x="529" y="455" text-anchor="middle">Context Provider · :8080</text>
  <text class="svcport coretext" x="529" y="467" text-anchor="middle">JSON-LD @context · data model</text>

  <rect class="svc core" x="424" y="478" width="210" height="34"/>
  <text class="svctext coretext" x="529" y="495" text-anchor="middle">QuantumLeap · :8669</text>
  <text class="svcport coretext" x="529" y="507" text-anchor="middle">time-series history over CrateDB</text>

  <!-- MCP Server -> Orion-LD (drawn after CORE box so the arrowhead is visible) -->
  <path class="flow" d="M372,417 L422,417" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="397" y="411" font-size="8.5" text-anchor="middle">NGSI-LD</text>

  <!-- ===== INDUSTRIAL INGESTION (right) ===== -->
  <rect class="layer" x="668" y="370" width="250" height="150"/>
  <text class="layertitle" x="688" y="390">INDUSTRIAL INGESTION (OT)</text>

  <rect class="svc ot" x="688" y="410" width="210" height="42"/>
  <text class="svctext ottext" x="793" y="431" text-anchor="middle">IoT Agent OPC-UA · :4041</text>
  <text class="svcport ottext" x="793" y="444" text-anchor="middle">north API · OPC-UA → NGSI-LD</text>

  <rect class="svc ot" x="688" y="462" width="210" height="42"/>
  <text class="svctext ottext" x="793" y="483" text-anchor="middle">OPC-UA Linker Backend · :8020</text>
  <text class="svcport ottext" x="793" y="496" text-anchor="middle">REST API · OPC-UA server :5679</text>

  <!-- ingestion -> core: straight horizontal from IoT Agent into Orion-LD -->
  <path class="flow" d="M688,420 L636,420" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="661" y="413" font-size="9" text-anchor="middle">NGSI-LD</text>

  <!-- OPC-UA Linker Frontend (UI): grey box wrapper same width as INDUSTRIAL INGESTION -->
  <rect class="layer" x="668" y="292" width="250" height="56"/>
  <rect class="svc cli" x="693" y="304" width="200" height="34"/>
  <text class="svctext clitext" x="793" y="320" text-anchor="middle">OPC-UA Linker Frontend · :8030</text>
  <text class="svcport clitext" x="793" y="333" text-anchor="middle">React dashboard (Nginx)</text>

  <!-- frontend box -> ingestion box (REST), between the two grey boxes -->
  <path class="flow" d="M793,348 L793,368" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="800" y="362" font-size="9">REST</text>

  <!-- ===== DATA STORES (pushed down to y=600) ===== -->
  <rect class="layer" x="140" y="600" width="820" height="86"/>
  <text class="layertitle" x="160" y="620">DATA STORES</text>

  <rect class="svc db" x="160" y="628" width="180" height="44"/>
  <text class="svctext dbtext" x="250" y="647" text-anchor="middle">ChromaDB store · :8012</text>
  <text class="svcport dbtext" x="250" y="662" text-anchor="middle">RAG embeddings</text>

  <rect class="svc db" x="360" y="628" width="180" height="44"/>
  <text class="svctext dbtext" x="450" y="647" text-anchor="middle">MongoDB · :27020</text>
  <text class="svcport dbtext" x="450" y="662" text-anchor="middle">Orion-LD + IoT Agent</text>

  <rect class="svc db" x="560" y="628" width="180" height="44"/>
  <text class="svctext dbtext" x="650" y="647" text-anchor="middle">CrateDB · :4202</text>
  <text class="svcport dbtext" x="650" y="662" text-anchor="middle">QuantumLeap history</text>

  <rect class="svc db" x="760" y="628" width="180" height="44"/>
  <text class="svctext dbtext" x="850" y="647" text-anchor="middle">PostgreSQL · :5433</text>
  <text class="svcport dbtext" x="850" y="662" text-anchor="middle">Keycloak store</text>

  <!-- services -> stores (reordered: ChromaDB, MongoDB, CrateDB, PostgreSQL) -->
  <!-- RAG Manager (bottom, x265) -> ChromaDB (x250): straight down -->
  <path class="flow" d="M265,512 L265,626" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="272" y="560" font-size="9.5">RAG → ChromaDB</text>

  <!-- Orion-LD (x470) -> MongoDB (x450) -->
  <path class="flow" d="M470,512 L470,576 L450,576 L450,626" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="476" y="548" font-size="9.5">Orion-LD</text>

  <!-- QuantumLeap (x560) -> CrateDB (x650) -->
  <path class="flow" d="M560,512 L560,592 L650,592 L650,626" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="566" y="548" font-size="9.5">QuantumLeap</text>

  <!-- Keycloak -> PostgreSQL (x850): routed down the far right, clear of the ingestion box -->
  <path class="flow" d="M770,227 L938,227 L938,588 L850,588 L850,626" marker-end="url(#arrow)"/>
  <text class="flowlbl" x="900" y="583" font-size="9.5" text-anchor="middle">Keycloak</text>

  <!-- footer -->
  <text x="500" y="718" text-anchor="middle" font-size="11.5" fill="#8595a5">Orchestrated with Docker Compose · FIWARE ecosystem · multitenant (default tenant: sdm)</text>

  <!-- legend -->
  <g font-size="11" fill="#54636f">
    <rect class="svc cli"  x="120" y="738" width="14" height="14"/><text x="140" y="749">Client / UI</text>
    <rect class="svc gw"   x="218" y="738" width="14" height="14"/><text x="238" y="749">Gateway</text>
    <rect class="svc sec"  x="308" y="738" width="14" height="14"/><text x="328" y="749">Security</text>
    <rect class="svc core" x="396" y="738" width="14" height="14"/><text x="416" y="749">Data space</text>
    <rect class="svc ai"   x="512" y="738" width="14" height="14"/><text x="532" y="749">AI</text>
    <rect class="svc ot"   x="576" y="738" width="14" height="14"/><text x="596" y="749">Ingestion</text>
    <rect class="svc db"   x="672" y="738" width="14" height="14"/><text x="692" y="749">Data stores</text>
  </g>
</svg>
